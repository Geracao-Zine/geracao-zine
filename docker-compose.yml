services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zine}
      POSTGRES_DB: ${POSTGRES_DB:-geracao_zine}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # As migrations rodam dentro do container da app, entao esta porta serve
      # so para inspecionar o banco de fora (psql, GUI). Sem essa necessidade,
      # remover a publicacao evita conflito com um Postgres ja no host.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zine} -d ${POSTGRES_DB:-geracao_zine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: geracao-zine:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      # A imagem alpine traz wget; use ele para nao depender de pacote extra.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      # O entrypoint aplica as migrations antes de abrir a porta, entao a
      # primeira checagem precisa de folga para o banco responder.
      start_period: 60s

volumes:
  db-data:
